distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 全工程统一用一个国内源：腾讯云。它同时提供 Gradle 发行包和 Maven 依赖，
# 免得一会儿阿里一会儿腾讯（Maven 仓库的配置见 settings.gradle.kts）。
#   官方 services.gradle.org 会 307 跳转到 GitHub，国内经常超时 / Android Studio 同步失败；
#   腾讯云这份与官方逐字节一致，校验值见下面的 distributionSha256Sum。
# Gradle 的发行包缓存是按「URL 字符串的哈希」分目录的：换一个源就等于换缓存目录、
# 要重新下一份（约 140MB），所以各工程必须保持完全相同的 distributionUrl。
distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
